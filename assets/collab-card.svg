<rect width="1" height="1" fill="#b6ff5c" opacity=".12"/><rect x="2" y="2" width="1" height="1" fill="#b6ff5c" opacity=".12"/></pattern>
<pattern id="dc" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="4" fill="#b6ff5c"/><rect width="2" height="2" fill="#000" opacity=".16"/><rect x="2" y="2" width="2" height="2" fill="#000" opacity=".16"/></pattern>
</defs>
<rect width="1000" height="260" fill="#080808"/>
<rect x="8" y="8" width="984" height="244" fill="#0f1408"/>
<rect x="8" y="8" width="984" height="244" fill="url(#dp)"/>
<rect x="8" y="8" width="984" height="244" fill="none" stroke="#b6ff5c" stroke-width="2"/>

<text x="48" y="62" font-size="15" font-weight="bold" fill="#b6ff5c" letter-spacing="3">OPEN SLOT AVAILABLE</text>
<text x="48" y="112" font-size="34" fill="#f3efe6" textLength="560" lengthAdjust="spacingAndGlyphs">Want to build something</text>
