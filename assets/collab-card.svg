<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="'Courier New', Courier, monospace">
<style>
.btn{animation:nudge 1.4s steps(1,end) infinite}
@keyframes nudge{0%{transform:translate(0,0)}50%{transform:translate(-3px,-3px)}100%{transform:translate(0,0)}}
.bob{animation:bob 2s steps(1,end) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
</style>
<defs>
