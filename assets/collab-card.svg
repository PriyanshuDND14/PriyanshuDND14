<rect width="220" height="196" fill="#b6ff5c"/>
<rect x="10" y="10" width="64" height="9" fill="#101010"/>
<rect x="12" y="12" width="8" height="5" fill="#b6ff5c"/><rect x="22" y="12" width="8" height="5" fill="#b6ff5c"/><rect x="32" y="12" width="8" height="5" fill="#b6ff5c"/><rect x="42" y="12" width="8" height="5" fill="#5a5a5a"/>
