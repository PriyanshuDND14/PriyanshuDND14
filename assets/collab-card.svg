<g class="bob"><rect x="72" y="55" width="11" height="11" fill="#f3efe6"/><rect x="138" y="55" width="11" height="11" fill="#f3efe6"/><rect x="72" y="66" width="22" height="11" fill="#f3efe6"/><rect x="127" y="66" width="22" height="11" fill="#f3efe6"/><rect x="72" y="77" width="77" height="11" fill="#f3efe6"/><rect x="72" y="88" width="77" height="11" fill="#f3efe6"/><rect x="72" y="99" width="77" height="11" fill="#f3efe6"/><rect x="83" y="110" width="55" height="11" fill="#f3efe6"/><rect x="83" y="88" width="11" height="11" fill="#101010"/><rect x="127" y="88" width="11" height="11" fill="#101010"/><rect x="105" y="99" width="11" height="11" fill="#eaa0a8"/><rect x="83" y="66" width="11" height="11" fill="#eaa0a8"/><rect x="127" y="66" width="11" height="11" fill="#eaa0a8"/></g>
<text x="10" y="170" font-size="22" font-weight="900" fill="#101010">COLLAB</text>
