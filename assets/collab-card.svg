<rect x="48" y="172" width="290" height="52" fill="#000" stroke="#b6ff5c" stroke-width="3"/>
<text x="193" y="206" font-size="20" font-weight="bold" fill="#b6ff5c" text-anchor="middle" letter-spacing="3">COLLABORATE</text>
</g>
<text x="366" y="204" font-size="14" fill="#9aa58a">priyanshu.mohanty121247@gmail.com</text>

